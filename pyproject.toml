[project]
name = "civicripple"
version = "0.1.0"
description = "Autonomous community continuity agent for food-bank delivery disruptions"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "shapely>=2.0,<3",
  "strands-agents==1.54.0",
  "botocore[crt]",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "bedrock-agentcore>=1.9,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civicripple"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "aws_integration: requires real AWS credentials and RUN_AWS_INTEGRATION=1 (costs money)",
]
